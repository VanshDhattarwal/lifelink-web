<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | LifeLink</title>

    <link rel="stylesheet" href="forgot-password.css">
   
</head>

<body>

    <section class="forgot-password-container">

        <a href="index.html" class="logo">LifeLink</a>

        <h1>Forgot Your Password?</h1>

        <p class="forgot-description">
            No worries! Enter the email address associated with your LifeLink account,
            and we'll send you a secure password reset link.
        </p>

        <form class="forgot-password-form">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email address"
                required>

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <a href="login.html" class="back-login">
            ← Back to Login
        </a>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

        <p class="support-text">
            Need help?
            <a href="contact.html">Contact the LifeLink Support Team</a>
        </p>

    </section>

</body>

</html>
