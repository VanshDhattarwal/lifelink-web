<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | LifeLink</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>



  



<div class="ecg-container">

    <svg viewBox="0 0 1000 120">

        <path class="ecg-line"
            d="M0 60
               L120 60
               L170 60
               L190 40
               L210 90
               L240 10
               L270 110
               L310 60
               L1000 60"/>

    </svg>

</div>







    <section class="login-box">


        <div class="login-logo">

    <div class="logo-circle">

        ❤️

    </div>

    <h2>LifeLink</h2>

    <span>Saving Lives Through Donation</span>

</div>

  <h1 class="welcome">

Welcome Back

</h1>

       <p class="subtitle">

Access your account securely and continue your mission of saving lives.

</p>

        <form>
<label>Email Address</label>

<div class="input-box">

    <span class="input-icon">📧</span>

    <input
        type="email"
        placeholder="Enter your email address"
        required>

</div>

         <label>Password</label>

<div class="input-box">

    <span class="input-icon">🔒</span>

    <input
        type="password"
        placeholder="Enter your password"
        required>

</div>

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>
<button class="login-btn" type="submit">

Login Securely →

</button>
        </form>

        <div class="security-badge">

    🔒 Your login is protected with secure encryption.

</div>

        <div class="register">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

    </section>

</body>

</html>
