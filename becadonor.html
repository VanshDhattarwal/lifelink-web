<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Donor | Lifelink</title>
</head>
<link rel="stylesheet" href="index.html">
<link rel="stylesheet" href="becadonor.css">

<body>
    <section class="donor-form">
        <h1>🩸 Become a LifeLink Donor</h1>
        <p>Join our community of verified blood donors and help save lives during emergencies</p>

        <form>

            <!-- Personal Information -->
            <h2>Personal Information</h2>

            <label for="fullname">Full Name *</label>
            <input type="text" id="fullname" placeholder="Enter your full name" required>

            <label for="dob">Date of Birth *</label>
            <input type="date" id="dob" required>

            <label for="gender">Gender</label>
            <select id="gender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Prefer not to say</option>
            </select>

            <label for="phone">Mobile Number *</label>
            <input type="tel" id="phone" placeholder="Enter mobile number" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter email address">

            <!-- Blood Information -->
            <h2>Blood Information</h2>

            <label for="blood">Blood Group *</label>
            <select id="blood" required>
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" placeholder="Enter your weight">

            <label for="lastdonation">Last Blood Donation Date</label>
            <input type="date" id="lastdonation">

            <label>Have you donated blood before?</label>

            <input type="radio" id="yes" name="donated">
            <label for="yes">Yes</label>

            <input type="radio" id="no" name="donated">
            <label for="no">No</label>

            <!-- Location -->
            <h2>Location</h2>

            <label for="state">State *</label>
            <input type="text" id="state" placeholder="Enter your state" required>

            <label for="city">City *</label>
            <input type="text" id="city" placeholder="Enter your city" required>

            <label for="area">Area / Locality *</label>
            <input type="text" id="area" placeholder="Enter your area" required>

            <label for="pincode">PIN Code</label>
            <input type="text" id="pincode" placeholder="Enter PIN Code">

            <!-- Availability -->
            <h2>Availability</h2>

            <label>Available for emergency blood donation?</label>

            <input type="radio" id="available" name="available">
            <label for="available">Yes</label>

            <input type="radio" id="notavailable" name="available">
            <label for="notavailable">No</label>

            <br><br>

            <label for="contact">Preferred Contact Method</label>

            <select id="contact">
                <option>Phone Call</option>
                <option>WhatsApp</option>
                <option>Email</option>
            </select>

            <!-- Health Declaration -->
            <h2>Health Declaration</h2>

            <input type="checkbox" id="healthy">
            <label for="healthy">I am currently healthy.</label>

            <br>

            <input type="checkbox" id="fever">
            <label for="fever">I have not had a fever in the last 14 days.</label>

            <br>

            <input type="checkbox" id="medicine">
            <label for="medicine">I am not taking medication that prevents blood donation.</label>

            <!-- Consent -->
            <h2>Consent</h2>

            <input type="checkbox" id="agree" required>
            <label for="agree">
                I confirm that the information provided is accurate and I agree to be contacted for genuine blood
                donation requests.
            </label>

            <br><br>

            <button type="submit">🩸 Register as a Donor</button>
    </section>

</body>

</html>
